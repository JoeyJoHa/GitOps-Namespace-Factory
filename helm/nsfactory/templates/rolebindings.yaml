{{- if .Values.RBACBindings }}
{{- range .Values.RBACBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .group }}-binding
  namespace: {{ $.Values.metadata.namespace }}
  labels:
    owner: {{ $.Values.metadata.owner }}
    environment: {{ $.Values.metadata.environment }}
   annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .clusterRole }}
subjects:
- kind: Group
  name: {{ .group }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}