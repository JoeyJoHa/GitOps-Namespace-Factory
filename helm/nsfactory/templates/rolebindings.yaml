{{- $roles := include "nsfactory.RBACMap" . | fromJson -}}
{{- range $roleName, $groupName := $roles }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $groupName }}-rolebinding
  namespace: {{ include "nsfactory.Namespace" $ }}
  labels:
    owner: {{ $.Values.owner }}
    environment: {{ $.Values.environment }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $roleName }}
subjects:
- kind: Group
  name: {{ $groupName }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}